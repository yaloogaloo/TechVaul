[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techvault"
version = "0.1.0"
description = "Local personal technical asset manager"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "keyring>=25",
    "lxml>=5.0",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "nh3>=0.2",
    "PySide6>=6.6",
    "readability-lxml>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "respx>=0.21",
]

[project.scripts]
techvault = "techvault.ui.app:main"
techvault-migrate-github-v2 = "techvault.archive.migrate_layout_v2:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
